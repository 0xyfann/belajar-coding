
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Pribadiku</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .profil {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
      border-radius: 24px;
      background: #1e293b;
      box-shadow: 0 10px 35px #0005;
    }

    .foto {
      
.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  box-shadow: 0 0 15px #60a5fa,
              0 0 30px #3b82f6;
  animation: melayang 3s ease-in-out infinite;
}

@keyframes melayang {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}
      

    h1 {
      color: #60a5fa;
      margin-bottom: 8px;
    }

    .deskripsi {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .tombol {
      display: block;
      padding: 13px;
      margin: 12px 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .tombol:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
</head>

<body>
  <div class="foto">
  <img src="profil.jpg" alt="Foto profil saya">
  </div>

    <h1>IRFAN</h1>
    <p class="deskripsi">
      Halo! Selamat datang di website pribadi saya.
      Saya sedang belajar coding dan membuat
      hal-hal baru menggunakan teknologi.
    </p>

    <a class="tombol" href="https://github.com/">
      GitHub Saya
    </a>

    <a class="tombol" href="https://instagram.com/">
      Instagram Saya
    </a>

    <footer>
      © 2026 Profil Pribadiku
    </footer>
  </div>
</body>
</html>
